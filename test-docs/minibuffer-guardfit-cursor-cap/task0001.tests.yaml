  AC-7:
    tests: []
    red_confirmed: false
    red_reason: >-
      AC-7 constrains the diff's shape (file scope; HandleKey and
      cursorPos unchanged; no test-only hook added to production code), not
      runtime behavior, so there is no executable red/green state for it.
      Verified by inspection: git diff --name-only lists exactly
