      to contain \"(search):
      \U0001F468‍\U0001F469‍\U0001F467‍\U0001F466ls\", got
      \" (search): ‍\U0001F467‍\U0001F466l   \"". width=24 (both
      cursor=l and cursor=s) already passed before implementation, matching
      the task plan's stated pre-implementation behavior for this
      criterion.
