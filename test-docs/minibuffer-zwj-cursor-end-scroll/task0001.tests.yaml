acceptance_tests:
  AC-1:
    tests: [TestMinibufferView_ZWJInputCursorAtEnd_ShowsUntruncated]
    red_confirmed: true
    red_reason: >-
      Before implementation, all subtests width=19..24 failed. Example
      (width=19): "expected visible text to contain \"(search):
      \U0001F468‍\U0001F469‍\U0001F467‍\U0001F466ls\", got
      \" (search): ‍\U0001F466ls  \"" -- the leading U+1F468 (and
      other leading members of the ZWJ sequence, depending on width) was
      dropped because the old code judged fit by the sum of each rune's
      own width instead of the input's actual display width.
  AC-2:
