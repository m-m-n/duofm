      the same region in HEAD's file no longer contains that assert_contains
      call; assert_not_contains "/testdata/dir1" remains directly after the
      "[" key press and its wait.
  AC-5:
    tests: [run_all_tests.sh file-ops, run_all_tests.sh history]
    red_confirmed: false
    red_reason: >-
      No observable red exists for this criterion in isolation: the checks
      being replaced/removed were bugs that always PASSED (never failed),
      so the unmodified pre-fix suite was already green under
      `run_all_tests.sh file-ops` and `run_all_tests.sh history` before this
      task started, exactly as it is after the fix. The criterion's actual
      contribution is a non-regression confirmation, verified by running
      both categories after the fix inside the E2E container: file-ops
      30/30 passed, history 12/12 passed. A full `docker run
      duofm-e2e-task0001:latest` (equivalent to `make test-e2e`, all
      categories) also ran clean: 264/264 passed. The criteria that do carry
      an observed red are AC-1/AC-2/AC-3/AC-4.
  AC-6:
    tests: []
    red_confirmed: false
    red_reason: >-
      No observable red is possible for this criterion before any change
      exists: prior to editing, `git diff --name-only <parent-branch>...HEAD`
      is empty, which vacuously satisfies "no *.go file, no helpers.sh
      change" without exercising anything. Confirmed green after
