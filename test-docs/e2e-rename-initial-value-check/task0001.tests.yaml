      helpers.sh.
  AC-7:
    tests: []
    red_confirmed: false
    red_reason: >-
      run_all_tests.sh --check-list was never observed failing during this
      task: it reported "OK: run list matches defined tests (123 entries)"
      both before any edit and after (same 123 entries, unchanged), because
