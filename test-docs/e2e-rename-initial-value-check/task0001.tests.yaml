      and no test_ function was added, removed, or renamed. There is no red
      state to observe for a naming constraint that was satisfied by
      construction from the first edit.
notes: >-
  Layout confirmation (SPEC.md A-2) was performed by building the E2E image
  from this worktree's test/e2e/Dockerfile and capturing the rename dialog's
  screen with tmux capture-pane -p inside the container (docker build -t
  duofm-e2e-task0001 -f test/e2e/Dockerfile ., then running duofm under tmux
  and driving it through the same key sequence as test_rename_file). The
  input field's middle row matched SPEC.md A-1 exactly: input-field left
  border (U+2502 "│"), one padding space, the base name, whitespace fill
  (the cursor renders as a plain appended space in plain-text capture, since
  tmux capture-pane -p drops the reverse-video attribute and this
  implementation always positions the cursor at the end of the value),
  input-field right border, one separating space, then the fixed extension
  (".txt"). No deviation from the plan's assumed layout was needed.
  assert_input_field_value forces LC_ALL=C.utf8 for its own grep -E call
  only (verified against the container's actual default locale, which is
  POSIX/C per `locale -a`: C, C.utf8, POSIX) so that a multi-byte cursor
  glyph, if one ever appears in a differently-rendered dialog, counts as one
  character rather than one byte per UTF-8 code unit; this does not affect
  the ambient locale of the rest of the test run. Temporary E2E docker
  images built for verification (duofm-e2e-task0001[:latest],
  -mutation, -mutation2) were removed after use; none were committed.
