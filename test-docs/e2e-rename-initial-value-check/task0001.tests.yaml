baseline_failures: []          # go test ./... : all packages ok, no failures (4a)
final_failures: []             # go test ./... re-run after implementation: all packages ok
acceptance_tests:
  AC-1:
    tests: []
    red_confirmed: true
    red_reason: >-
      Structural check (grep), not a named test. On the parent branch,
      `grep -n 'assert_contains "\$CURRENT_SESSION" "before_rename"\|assert_contains
      "\$CURRENT_SESSION" "navren_before"' test/e2e/scripts/tests/file_operation_tests.sh`
      found both bare-substring checks at lines 195 and 439 (observed both via
      Read and via `git show <parent-branch>:...`). After the fix, the same
      grep against HEAD's file finds zero matches: both call sites now use
      assert_input_field_value instead.
  AC-2:
    tests: [file_operation_tests.sh::test_rename_file, file_operation_tests.sh::test_navigation_after_rename]
    red_confirmed: true
    red_reason: >-
      With a temporary uncommitted change sending "C-u" immediately before
      each assert_input_field_value call, ran `run_all_tests.sh file-ops`
      inside the E2E container (docker build from test/e2e/Dockerfile on the
      task worktree, then `docker run ... /e2e/scripts/run_all_tests.sh
      file-ops`). Both "Rename dialog is pre-filled with the base name"
      checks failed (2 failed / 30 run), while the failure output's screen
      dump still showed "before_rename.txt" / "navren_before.txt" in the
      file list behind the dialog, and the on-disk rename checks right after
      still passed. Change reverted via `git checkout --
      test/e2e/scripts/tests/file_operation_tests.sh` (already committed
      clean state).
  AC-3:
    tests: [file_operation_tests.sh::test_rename_file, file_operation_tests.sh::test_navigation_after_rename]
    red_confirmed: true
    red_reason: >-
      With a temporary uncommitted change clearing the input ("C-u") and
      typing the full name with extension ("before_rename.txt" /
      "navren_before.txt") immediately before each assert_input_field_value
      call, ran `run_all_tests.sh file-ops` inside the E2E container. Both
      initial-value checks failed (2 failed / 30 run); the failure output's
      screen dump showed the input field row itself containing
      "before_rename.txt" / "navren_before.txt" directly followed by ".txt"
      before the right border, which is more than the "at most one"
      character the pass condition allows there. Change reverted via `git
      checkout -- test/e2e/scripts/tests/file_operation_tests.sh`.
  AC-4:
    tests: []
    red_confirmed: true
    red_reason: >-
      Structural check, not a named test. `git show <parent-branch>:test/e2e
      /scripts/tests/history_tests.sh` shows `assert_contains
      "$CURRENT_SESSION" "testdata"` ("[ key navigates back toward
      /testdata") present in test_history_forward_cleared, immediately
