schema_version: 1
feature: fix-e2e-failures
created: '2026-09-25'
base_branch: main
goal: '既存 E2E テスト 29 件の失敗（アーカイブ・リネーム・ブックマーク等）


  ## 現象 (必須)

  E2E テスト全体（`make test-e2e-build && make test-e2e`）で 29 件のアサーションが失敗する。

  main（cb86593）で E2E の入口を `run_all_tests.sh` に向けて実行すると、214 件中 184 件成功・29 件失敗。

  mouse-support の統合ブランチでも同じ 29 件が失敗する（217 件中 187 件成功）。

  失敗しているテスト:

  - Archive Tests（22 件）: test_compress_format_dialog_opens / test_compress_format_navigation / test_compression_level_dialog
  / test_archive_name_dialog / test_archive_conflict_dialog / test_compress_cancel_workflow / test_compress_complete_workflow
  / test_extract_complete_workflow / test_multifile_compress

  - File Operation Tests: test_rename_file（Rename dialog appears / New filename appears in listing）

  - Mark Tests: test_batch_delete_marked_files（Files were not deleted）

  - Sort Tests: test_sort_dialog_q_cancel（Sort dialog closes after q）

  - Shell Tests: test_help_shows_shell_command（Help dialog shows shell command key）

  - Bookmark Tests: test_bookmark_dialog_opens（Bookmark dialog shows D:Delete hint）

  - History Navigation Tests: test_history_forward_cleared（Forward history cleared after new navigation）

  ## 再現手順 (必須)

  1. `test/e2e/Dockerfile` の CMD が `/e2e/scripts/run_all_tests.sh` を指す状態にする（mouse-support の PR で修正済み）

  2. `make test-e2e-build && make test-e2e` を実行する

  3. Test Summary で Failed: 29 になる

  ## 期待する挙動 (必須)

  E2E テストが全件成功する。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  `test/e2e/scripts/tests/archive_tests.sh` / `file_operation_tests.sh` / `mark_tests.sh` / `sort_tests.sh`
  / `shell_tests.sh` / `bookmark_tests.sh` / `history_tests.sh`

  ## 実害・発生条件 (任意)

  これまでは E2E の入口（Dockerfile の CMD が存在しない `run_tests.sh` を指していた）が壊れていて、失敗が表に出ていなかった。

  テスト側の期待値が古いのか、アプリ側の不具合なのかは未調査。

  '
