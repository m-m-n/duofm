schema_version: 1
feature: minibuffer-grapheme-cursor-highlight
created: '2026-09-27'
base_branch: main
goal: |
  # ミニバッファのカーソルが書記素の途中にあると結合文字列が分かれて描画される

  Notion タスク: https://www.notion.so/3e73509ec8ee8184bccee4950aecc8d5 （種別: バグ）

  ## 現象 (必須)
  ミニバッファのカーソルが書記素（ZWJ 連結の絵文字など）の途中の rune にあるとき、カーソル位置の rune だけを反転表示するため、結合文字列が分かれて描画される。結合が分かれると描画幅も増えるため、収まっていた入力が縮小ループで切り詰められることもある。
  minibuffer-zwj-cursor-end-scroll（PR #10）では、カーソル位置の rune だけを反転表示する既存の描画は変えないことにした（SPEC の前提 a4）。

  ## 再現手順 (必須)
  1. ミニバッファを開く
  2. 家族の絵文字（U+1F468 U+200D U+1F469 U+200D U+1F467 U+200D U+1F466）を入力する
  3. カーソルを左へ 1 つずつ動かし、絵文字を構成する rune の途中に置く

  ## 期待する挙動 (必須)
  カーソルは書記素単位で移動するか、書記素の途中にあっても書記素全体を 1 つのまとまりとして反転表示し、結合文字列を分けて描画しない。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)
  `internal/ui/minibuffer.go`（カーソル移動と View のカーソル位置の反転表示）

  ## 実害・発生条件 (任意)
  入力に ZWJ 連結などの結合文字列が含まれ、カーソルをその内部に移動したとき。

  ## 追加指示（起動引数）
  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・remote 両方に残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較して良いと判断した案を採用する
  - その議論内容を Notion に記録する
