  title: "graphemeClusterBounds が uniseg.NewGraphemes を使い入力長に対して二乗時間になる（NFR3 違反）"
  description: "graphemeClusterBounds は uniseg.NewGraphemes の Next() で書記素を走査している。Next() 内部の StepString は書記素に加えて単語・文・行の境界も計算し、文境界規則 SB8 は ATerm（.）の後の Sp 1 つごとに残りの入力を先読みする。「.」+ 空白 n 個 +「A」の入力で 1 回の呼び出しが O(n^2) になる（評価者の計測: n=1000/2000/4000/8000 で 5.9ms/23.5ms/95ms/380ms。FirstGraphemeClusterInString での走査は 13/25/52/105µs で線形）。View（483 行）、Left/Ctrl+B（152 行）、Right/Ctrl+F（164 行）から毎回呼ばれる。SPEC NFR3 の書記素区切り計算の線形要件に反する。元の報告は license#0 だが内容は性能であり、評価者が独立に検証して spec 観点として出し直した。"
  suggestion: "NewGraphemes のループをやめ、入力先頭から uniseg.FirstGraphemeClusterInString(rest, state) を state=-1 で始めて状態を引き継ぎながら rune 数を数える走査に置き換える。「.」+ strings.Repeat(\" \", n) +「A」でカーソルを末尾付近に置き、View と Left/Right の計算時間が線形であることを確かめる回帰テストを追加する。"
  sources: [claude:evaluator]
  confidence: 90
  resolution: unresolved
  resolution_reason: "medium のため Phase R4 の auto-fix 候補外（候補条件は critical/high）。別タスクとして起票する"
