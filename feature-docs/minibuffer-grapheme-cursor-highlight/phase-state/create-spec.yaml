answers:
  req.cursor-grapheme-approach:
    packet_id: create-spec-q0001
    answered_at: '2026-09-27T18:48:07+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - grapheme_move_and_highlight
    freeform: null
    normalized_answer: Left/Right/Ctrl+B/Ctrl+F は書記素単位で移動する。SetCursorPos などで書記素の途中に置かれた場合も、カーソルを含む書記素全体を 1 つのまとまりとして反転表示する。
    resolution_note: 'gate: create-spec.requirement-clarification; options: grapheme_move_and_highlight / grapheme_move_only / highlight_whole_grapheme_only; chosen: grapheme_move_and_highlight; codex_consulted:
      true (codex entry, 1 turn); opus_escalation: false; key points: Codex 1 ターンで全問が収束（codex entry, 1 turn）。Q1 SetCursorPos（タブ補完）は書記素の途中も受け付けるため、移動だけ直しても途中位置で分割描画が残り、反転だけ直すと家族絵文字上で複数回キーを押す間同じ絵文字が反転し続けるので、移動と反転の両方を直す。Q2
      削除・挿入・行内消去は rune 位置で入力を編集しており、移動と反転はこれと独立して直せるため編集は範囲外。Q3 表示窓は書記素と異なる widthUnit を使い末尾スクロールと共有しているため、今回はカーソル前後の分割位置を書記素の開始・終了へ変える範囲に絞る。実装注記: 既存 uniseg v0.4.7 で区切り（直接使うなら indirect を外す）、幅は lipgloss.Width
      で測る。cursorPos は rune 位置のまま、途中からの左移動は書記素の開始、右移動は終了へ。反転範囲 [start,end) を buildLine と窓選択で共有。テストは描画器を ANSI256 に固定し t.Cleanup で戻す。境界計算は線形を維持。'
