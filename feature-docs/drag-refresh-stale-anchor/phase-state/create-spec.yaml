  requirement.change-detection:
    packet_id: create-spec-q0001
    answered_at: '2026-09-27T17:12:22+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - compare_displayed_names
    freeform: null
    normalized_answer: ドラッグ中のペインの表示一覧（フィルタ適用後の entries）の名前の並びが押下時と違えば、ドラッグを取り消す。名前と順序が同じでサイズや時刻だけが変わった場合は取り消さない。
    resolution_note: 'gate: create-spec.requirement-clarification; options: compare_displayed_names / remap_anchor_by_name / compare_entry_count; chosen: compare_displayed_names; codex_consulted: true (codex
      entry, 1 turn); opus_escalation: false; key points: Codex 1 ターンで全問が収束（codex entry, 1 turn）。Q1 範囲マークも行対応も表示中の entries（フィルタ後）を使うので名前の並び比較が合う。件数比較は同数入れ替えを見逃し、名前で付け直す方式は増えたファイルまで範囲に含める。Q2 手動更新は Pane.Refresh、削除後は
      ReloadDirectoryWithFilter、bg 完了は bgCleanupAndRefresh と経路が多く、関数単位の対象指定は取りこぼすため経路を問わず表示一覧の変化で判定する。Q3 既存の取り消しもマークに触れず、RefreshDirectoryPreserveCursor が消えた名前のマークを外すので保持が一貫する。baseline に戻すと正しく付けたマークが失われ、削除処理が消したマークが復活しうる。Q4
      autoRefreshMsg を直接 Update に渡す既存ヘルパーで待ち時間なしに再現できる。E2E は固定待機と自動更新待ちが重なり不安定。実装注記: 押下時に表示一覧の名前を独立配列へコピーし、updateDrag の行判定前で比較する。'
