schema_version: 1
feature: minibuffer-vs16-regression-test
created: '2026-09-27'
base_branch: main
goal: '# ミニバッファの VS16 付き絵文字の幅に回帰テストを追加する


  Notion task: https://www.notion.so/3e73509ec8ee81e781dafb7c728d0e6b (種別: バグ)


  ## 現象 (必須)

  ミニバッファで VS16（U+FE0F）付き絵文字の表示幅を過小評価して 2 行に折り返す不具合（レビュー指摘 stable_id: 1372160ec8ca2a16、high）は、minibuffer-wide-prompt-wrap の review 自動修正で直したが、再発を検出する回帰テストが追加されていない。

  ## 再現手順 (必須)

  1. ミニバッファ幅 37 で、プロンプト `(reverse-i-search)''日本語'': ` を表示する

  2. 入力に U+2764 U+FE0F を 4 個並べ、カーソルを末尾に置く

  3. 修正前の実装では 37 桁になり 2 行に折り返していた。現在この条件を検査するテストが無い

  ## 期待する挙動 (必須)

  VS16 付き絵文字を含む入力・プロンプトでも、ミニバッファは 1 行で描画され、それをテストが保証する。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  `internal/ui/minibuffer.go`（View の表示範囲決定と縮小ループ）/ `internal/ui/minibuffer_test.go`

  ## 実害・発生条件 (任意)

  現時点の実装では起きない。今後の変更で VS16 の幅計算が退行しても検出できない。


  ## 追加指示

  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作る。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）

  - 不明点は Codex に相談し、相対的に良いと判断した案を採用する

  - その議論内容を Notion に記録する

  '
