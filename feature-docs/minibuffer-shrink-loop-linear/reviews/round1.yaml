    title: "ガードの再計測上限に達すると、単独なら収まるカーソルまで消える"
    description: "guardFit は 3 回縮小しても収まらないと false を返す。3 つのフォールバック（493 行の cursorAtEnd、558 行の Step 4、594 行の Step 5）は、どれも入力とカーソルをまとめて非表示にしている（displayStart=displayEnd、cursorDisplayPos=-1）。IMPLEMENTATION.md の CD4 は「まだはみ出すなら窓をカーソルだけ（カーソルの rune、末尾ならカーソルブロック）に縮め、それでもはみ出すときだけ入力を出さない」と定めている。実装にはカーソルだけを試す段が無い。これは SPEC FR3（カーソル位置の文字が表示範囲に入る）に反していて、変更前の 1 rune ずつ縮めるループでは保たれていた挙動が後退している。494 行のコメント「even the cursor block alone overflows」も実際の判定と合っていない。評価者が go test -overlay で一時テストを重ねて再現した（プロジェクトのファイルは変更していない）。(1) Step 4: 幅 27、空プロンプト、入力 \"X\" + (\"\\u0600\\U0001F600\\uFE0E\"×7) + ZWJ でつないだ家族絵文字、cursorPos=0 で X が表示されない。X 単独なら幅 1 で収まる。ASCII と ANSI の両方の色プロファイルで再現した。(2) cursorAtEnd: 幅 30、プロンプト「!: 」、入力は家族絵文字 + 同じ組み合わせ ×7、カーソルは末尾で、カーソルブロックが消える。(3) Step 5 の経路でも幅 30 で同じく再現した。"
    suggestion: "3 つのフォールバックそれぞれで、guardFit が失敗したら、まずカーソルだけの窓をプロンプトと組み立てて 1 回だけ計測する。窓は、Step 4/5 では runes[cursorPos:cursorPos+1]（cursorDisplayPos=0）、cursorAtEnd では空の範囲 + cursorDisplayPos=0 のカーソルブロックにする。収まればそれを使い、収まらないときだけ入力を非表示にする（CD4 のとおり）。上の再現入力（cursorPos=0 の X、末尾のカーソルブロック）でカーソルが残ることを確かめる回帰テストも追加する。"
    sources: ["codex:spec"]
    confidence: 95
    resolution: unresolved
    resolution_reason: "medium のため auto-fix 対象外（R4 の候補条件は critical/high のみ）"
