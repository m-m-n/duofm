schema_version: 1
feature: minibuffer-shrink-loop-linear
created: '2026-09-27'
base_branch: main
goal: |
  # ミニバッファの縮小ループが大量の結合文字入力で二次時間になり操作不能になる

  Notion: https://app.notion.com/p/3e73509ec8ee81c5b706d5f9aa7e02c3 (種別: バグ)

  ## 現象 (必須)
  ミニバッファの表示範囲を決める縮小ループが、先頭の幅 0 の文字を 1 個ずつ削りながら残り全体を組み立てて `lipgloss.Width` で実測するため、処理量が入力長の二乗になる。大量の結合文字を含む文字列を貼り付けると再描画が長時間止まり、操作できなくなる。
  レビュー指摘 stable_id: 408ffc35dd15e043（medium、minibuffer-wide-prompt-wrap の review round1 で未解決）
  ## 再現手順 (必須)
  1. 端末幅 80 で duofm を起動する
  2. シェルコマンド入力（プロンプト `!: `）を開き、カーソルを末尾に置く
  3. U+0301 を 10 万個、ASCII 文字を 71 個、U+00A9 U+FE0F の順に並べた文字列を貼り付ける
  ## 期待する挙動 (必須)
  大量の結合文字を含む入力でも、ミニバッファの再描画が入力長に対して線形の時間で終わる。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  `internal/ui/minibuffer.go:368`（View の縮小ループ）
  ## 実害・発生条件 (任意)
  幅 0 の文字を大量に含み、結合後の幅が rune ごとの幅の合計を超える文字（VS16 付き絵文字など）を含む入力を貼り付けたとき。

  ## 追加指示（起動引数より）
  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモートともに残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較してより良いと判断した案を採用する
  - その議論内容を Notion に記録する
