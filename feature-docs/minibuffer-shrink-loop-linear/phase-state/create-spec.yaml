    normalized_answer: ミニバッファ幅 80 に ASCII 71 個（端末幅 160 相当、レビュー指摘と同じ条件）と、ミニバッファ幅 40 に ASCII 31 個（端末幅 80 で二乗の経路に入る条件）の両方を、完了の定義とテストの入力にする。
