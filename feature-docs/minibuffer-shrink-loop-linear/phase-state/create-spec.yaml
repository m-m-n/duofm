      10 万 rune を 100ms 未満で処理し現行は数分かかるため 10 秒上限なら両方向に約 100 倍の余裕がある点を提示。Codex は、View 全体の停止を検出でき本体変更が不要な deadline に変更して収束（-race・遅い CI での余裕は実測で確かめること、両幅・末尾以外のカーソル・長いプロンプトも対象にすること、を付記）。他 3 問は両ターンで一致。'
