schema_version: 1
feature: e2e-unregistered-test-file-guard
created: '2026-09-27'
base_branch: main
goal: |
  # E2E run_all_tests.sh で TEST_FILES 未登録ファイルのテストが集計から漏れる

  Notion task: https://www.notion.so/3e63509ec8ee8133bd41db9f5aaf69c9 (種別: バグ)

  ## 現象 (必須)
  `run_all_tests.sh` の `run_all` は `TEST_FILES` に登録されたファイルだけを source する。一方、未定義エントリのガードは `tests/*.sh` の静的な名前集合で判定している。
  `helpers.sh` の `run_test` は関数呼び出しの失敗（command not found）を集計しない。
  そのため、`TEST_FILES` 未登録のファイルにあるテストを `FULL_RUN_LIST` に加えると、ガードは通るのに本実行では未定義のまま呼ばれ、Total にも Failed にも数えられず終了コード 0 で終わる。
  現状は `tests/` の 14 ファイルすべてが `TEST_FILES` に載っているため潜在不具合。

  ## 再現手順 (必須)
  1. `test/e2e/scripts/tests/` に新しいテストファイルを追加し、テスト関数を定義する
  2. そのファイルを `TEST_FILES` に登録せず、関数名だけを `FULL_RUN_LIST` に加える
  3. `make test-e2e-build && make test-e2e` を実行する
  4. 追加したテストが実行されず、失敗にも数えられずに終了コード 0 になる

  ## 期待する挙動 (必須)
  未登録ファイルのテストが実行一覧にある場合、実行されるか、失敗として数えられる。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)
  `test/e2e/scripts/run_all_tests.sh:363` / `test/e2e/scripts/helpers.sh` の `run_test`
  ブランチ em-workflow/fix-e2e-failures/integration（PR https://github.com/m-m-n/duofm/pull/4 ）
  レビュー指摘 f7ccb13cac7b0bdb

  ## 実害・発生条件 (任意)
  テストファイルを追加して `TEST_FILES` への登録を忘れたときだけ起きる。

  ## 追加指示（起動引数）
  - 実装完了後、integration ブランチを remote へ push し、base_branch への PR を gh pr create で作成する。integration ブランチはローカル・リモート両方に残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する
  - その議論内容を Notion に記録する
