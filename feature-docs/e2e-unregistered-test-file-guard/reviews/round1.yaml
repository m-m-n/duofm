- stable_id: 78ba4f8a81887623
  severity: medium
  category: spec
  file: test/e2e/scripts/runner_self_test.sh
  line: 100
  title: "apply_fixture_lists creates its scratch files outside SELF_TMPDIR, which violates NFR2"
  description: "SPEC NFR2 says the self-test may write only under the temporary directory it creates itself with mktemp. At lines 100 and 107, apply_fixture_lists calls `mktemp` with no template, creating a file directly in ${TMPDIR:-/tmp}, outside SELF_TMPDIR. awk writes the rewritten runner there, then `mv` moves it into the fixture dir. If awk fails, the tmp file is left behind outside the EXIT trap's cleanup. The header comment at line 17 is also inaccurate. Practical impact is small: /testdata and /e2e/scripts are never touched."
  suggestion: "Pass a template under SELF_TMPDIR to both calls, e.g. tmp=\"$(mktemp \"${SELF_TMPDIR}/runner.XXXXXX\")\"."
  sources: [codex:spec]
  confidence: 90
  resolution: unresolved
  resolution_reason: "medium severity: outside the auto-fix candidate gate (critical/high only, category != spec)"
