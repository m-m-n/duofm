schema_version: 1
feature: fix-batch-cancel-cursor-flake
created: '2026-09-26'
base_branch: main
goal: '# E2E test_batch_cancel_cursor がマーク順序に依存して断続的に失敗する


  Notion: https://www.notion.so/3e63509ec8ee81278371f4dcdd4f9648 (種別: バグ)


  ## 現象 (必須)

  E2E の `test_batch_cancel_cursor`（`test/e2e/scripts/tests/cursor_preserve_tests.sh`）が「First file was
  moved before cancel」で断続的に失敗する。fix-e2e-failures の verify 中、全体実行 1 回で発生した。同じ内容の全体実行は他に 2 回とも成功している。

  ## 再現手順 (必須)

  1. `make test-e2e-build && make test-e2e` を繰り返し実行する

  2. まれに `test_batch_cancel_cursor` で「First file was moved before cancel」が出る

  ## 期待する挙動 (必須)

  `test_batch_cancel_cursor` が毎回成功する。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  - `test/e2e/scripts/tests/cursor_preserve_tests.sh` の `test_batch_cancel_cursor`（01_aaa が先に移動すると仮定している）

  - `internal/ui/pane_marks.go` の `GetMarkedFiles`（map を列挙するため順序が保証されない）

  ## 実害・発生条件 (任意)

  マークしたファイルの処理順が 02_bbb から始まったときに失敗する。


  ## 追加指示

  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch 向け PR を作成する。integration ブランチはローカル・リモート両方に残す（base_branch
  へ自動マージしない）

  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する

  - その議論内容を Notion に記録する

  '
