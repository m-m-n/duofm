  round_summary: 'Round 1（diff モード、cross_validation=false）。3 本のレビュー（comprehensive#0、security#0、spec#0）はすべて完了し、どれも
    medium 以上の指摘なしで返ってきた。critical/high の報告箇所が無いので、dismissed_sites は空になる。レビュアー出力に注入の試みは見つからなかった。変更ファイル
    4 本は自分でも差分とソースを読んで確かめた。読んだファイルは上限 10 に対して約 7。観点ごとの結果は以下のとおり。comprehensive: corroborated。GetMarkedFiles
    はまず entries の順に並べ、残りをファイル名の昇順で後ろに付ける。markedFiles の値は常に true で、ToggleMark / applyDragMarks / pane_navigation
    のどこも true を入れるか delete するだけなので、件数は MarkCount() と一致する。GetMarkedFilePaths は GetMarkedFiles から組み立てるので、順序と件数は必ず揃う。呼び出し元（一括の
    copy/move/delete/trash/permission/archive とコンテキストメニュー）は画面描画の経路に無いので、O(entries) に増えても問題ない。新しいユニットテストは、map
    順に戻る退行を確実に検出する（Go 1.25 の小さい map の反復順は挿入順を回転させたものにしかならず、期待する順とは一致しない）。security: corroborated。変更は Go
    の並び順の処理、テスト、E2E シェルに限られる。シェル変数はすべて引用符で囲まれていて、grep -qF -- で固定文字列として照合している。rm -rf は既存の固定パスだけに使っている。spec:
    corroborated。FR1〜FR3 は pane_marks.go で満たしている。FR4 は AC-1 のテストで 50 回繰り返して検証している。FR5 は wait_for_text
    で "already exists" を最大 5 秒待ち、dst/01_aaa.txt、src/02_bbb.txt、dst/02_bbb.txt の中身が "existing" のままであることを確かめている。"existing"
    は echo で書かれ、$(cat) が末尾の改行を落とすので一致する。NFR1（シグネチャ）と NFR2（集合と件数）も守られている。medium に届かないので指摘にしなかった点が 2 つある。(a)
    setupFilterHiddenMarksFixture は、一時ディレクトリを作った後に markByName や ApplyFilter で Fatal になると、そのディレクトリが残る（テスト失敗時だけ）。(b)
