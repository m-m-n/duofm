goal: |
  # ミニバッファでカーソル末尾のとき ZWJ 連結の絵文字の先頭が削られる

  Notion タスク: https://www.notion.so/3e73509ec8ee81c8a425d7798dd88282 （種別: バグ）

  ## 現象 (必須)
  ミニバッファでカーソルが末尾にあるとき、スクロール開始位置を rune ごとの幅の合計で決めている。ZWJ 連結の絵文字のように結合で幅が縮む入力では幅を過大評価し、実際には収まる入力の先頭の code point を削ってしまう。後段の縮小ループは開始位置を戻さないため、書記素の途中で切れた別の絵文字として表示される。
  レビュー指摘 stable_id: abb435ae05afd8f2（medium、minibuffer-wide-prompt-wrap の review round1 で未解決）

  ## 再現手順 (必須)
  1. 内容幅 24 になる幅でミニバッファを開き、プロンプトを `(search): `（10 桁）にする
  2. 入力の先頭に家族の絵文字（U+1F468 U+200D U+1F469 U+200D U+1F467 U+200D U+1F466）を置き、続けて `ls` を入力し、カーソルを末尾に置く
  3. 実際の表示幅は残り 10 桁に収まるのに、先頭の code point が削られて表示される

  ## 期待する挙動 (必須)
  実際に収まる入力は、結合文字列を途中で切らずにそのまま表示される。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)
  `internal/ui/minibuffer.go:302`（View の cursorAtEnd 分岐）

  ## 実害・発生条件 (任意)
  入力に ZWJ 連結など、結合後の幅が rune ごとの幅の合計より狭くなる文字列が含まれ、カーソルが末尾にあるとき。

  ## 追加指示
  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作成する。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）。
  - 不明点は Codex に相談し、相対的に良いと判断した案を採用する。その議論内容を Notion に記録する。
