schema_version: 1
feature: minibuffer-grapheme-scroll-boundary
created: '2026-09-27'
base_branch: main
goal: '# ミニバッファのスクロール時に表示範囲の境界が書記素の途中になる


  Notion: https://www.notion.so/3e73509ec8ee81aeb641c634741b31d7 (種別: バグ)


  ## 現象 (必須)

  ミニバッファの入力が実際の表示幅でも残りの幅に収まらず、スクロールが必要なとき、表示範囲の開始・終了位置が rune 単位で決まるため、境界が書記素（ZWJ 連結の絵文字など）の途中になることがある。途中で切れた結合文字列は別の絵文字や部品として表示される。

  minibuffer-zwj-cursor-end-scroll（PR #10）では、入力全体が実際の幅で収まる場合だけを修正対象にした（SPEC の前提 a2）。スクロールが必要な場合の境界はこの修正に含めていない。


  ## 再現手順 (必須)

  1. 内容幅が狭いミニバッファ（例: `m.width=24`、プロンプト `(search): ` 10 桁、残り 10 桁）を開く

  2. 家族の絵文字（U+1F468 U+200D U+1F469 U+200D U+1F467 U+200D U+1F466）を含み、全体では残り幅に収まらない入力をする（例:
  絵文字の前後に英字を数文字ずつ置く）

  3. カーソルを動かして表示範囲の境界が絵文字にかかる位置までスクロールさせる


  ## 期待する挙動 (必須)

  スクロールで表示範囲が決まるときも、境界は書記素の境目に揃い、結合文字列を途中で切らずに表示する。


  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所 (任意)

  `internal/ui/minibuffer.go`（View のスクロール開始位置・終了位置の決定）


  ## 実害・発生条件 (任意)

  入力に ZWJ 連結などの結合文字列が含まれ、入力全体が残りの幅に収まらずスクロールが必要なとき。


  ## 追加指示

  - 実装完了後、integration ブランチを remote へ push し、base_branch への PR を gh pr create で作成する。integration
  ブランチはローカル・remote とも残す（base_branch へ自動マージしない）

  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する

  - その議論の内容を Notion に記録する

  '
