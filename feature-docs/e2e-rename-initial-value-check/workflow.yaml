schema_version: 1
feature: e2e-rename-initial-value-check
created: '2026-09-27'
base_branch: main
goal: '# E2E リネームテストの初期値チェックが常に通る


  Notion task: https://www.notion.so/3e63509ec8ee81138a78d466708fa2da

  種別: 改善


  ## やりたいこと (必須)

  E2E のリネームテストで、ダイアログ入力欄の初期値を実際に検証できるようにする。


  ## 背景・なぜ (必須)

  `file_operation_tests.sh` の `assert_contains "before_rename"`（195 行目）と `assert_contains
  "navren_before"`（439 行目）は、ダイアログ背後のファイル一覧に同名ファイルが表示されている限り、入力欄の初期値に関係なく通る。

  `history_tests.sh` 167 行目の `assert_contains "testdata"` もパス表示により常に通る（直後の `assert_not_contains`
  が実際の判定を担っている）。

  ブランチ em-workflow/fix-e2e-failures/integration（PR https://github.com/m-m-n/duofm/pull/4
  ）

  レビュー指摘 537ddc2b5d008e78


  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] 初期値の照合が、入力欄にしか出ない形で行われる

  - [ ] `navren_before` のチェックも同様に直す

  - [ ] `history_tests.sh` の常に通る `testdata` チェックを削除するか、パス表示行に絞る


  ## 制約・前提 (任意)

  Go のソースは変更しない。

  '
