schema_version: 1
feature: minibuffer-guardfit-cursor-cap
created: '2026-09-28'
base_branch: main
goal: |
  # ミニバッファの guardFit が再計測上限に達すると、単独なら収まるカーソルまで消える

  Notion タスク: https://www.notion.so/3e83509ec8ee81a7ae62e70d1b56dae5 （種別: バグ）

  ## 現象 (必須)
  ミニバッファの表示範囲を決める guardFit が、組み立てた行の再計測上限（3 回）で幅に収まらないとき、単独なら収まるカーソル文字／カーソルブロックまで非表示になる。
  minibuffer-shrink-loop-linear の review round1 で未解決のまま残った medium 指摘（stable_id `9925cb2f380c82a9`）。SPEC FR3・IMPLEMENTATION.md CD4（カーソルの可視性を維持する）からの逸脱。
  PR: https://github.com/m-m-n/duofm/pull/14

  ## 再現手順 (必須)
  1. 幅の見積もりが実測より小さくなる文字（ZWJ 絵文字や VS16 付き絵文字など）を多く含む入力をミニバッファに入れる
  2. guardFit の補正が 3 回で収束しない状態にする

  ## 期待する挙動 (必須)
  再計測上限に達した場合でも、カーソル単独で幅に収まるならカーソルは表示される。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)
  `internal/ui/minibuffer.go:558` 付近（`internal/ui/minibuffer.go:493` / `:558` / `:594` の 3 経路）

  ## 実害・発生条件 (任意)
  幅の見積もりと実測が大きくずれる文字を含む入力のときだけ起きる。

  ## 追加指示
  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作成する。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）。
  - 不明点は Codex に相談し、相対的に良いと判断した案を採用する。その議論内容を Notion に記録する。
