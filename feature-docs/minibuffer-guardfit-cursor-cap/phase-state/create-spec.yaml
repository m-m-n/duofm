    freeform: '案 C を採用: View 経由の回帰テストを 3 経路それぞれに置く。共通条件は SetPrompt("؀")・SetWidth(10)・Show()（内容幅
      6、プロンプト幅 1、入力に使える幅 5）。g1 = "😀︎"、g2 = "❤‍" + g1、g3 = "❤‍" + g2、g4 = "❤‍" + g3（いずれも
      1 書記素で単独の lipgloss.Width は 1、プロンプト U+0600（Prepend）と直接連結すると幅 3/4/5/6）。末尾カーソルの経路:
      入力 g1+g2+g3+g4、カーソル 20。右側を削ってから左側を削る経路: 入力 g2+g3+g4+"xyz"、カーソル 18（"x"）。左側をスクロールする経路:
      入力 "z"+g1+g2+g3+g4+"x"、カーソル 21（"x"）。3 例とも再計測上限で失敗し、プロンプト + カーソル単独なら幅 2 で収まる（Codex
      がコードと uniseg v0.4.7 の幅計算を読み再現計算で確認。Go での実行は未確認）。検証は既存の fix256ColorProfile と
      reversedRuns を使い、反転区間が末尾では空白 1 文字、それ以外では "x" の 1 区間だけになること、プロンプトが残ること、g1〜g4
      の文字が残らないこと、assertBoundedSingleLine を満たすことを確かめる。末尾カーソルは反転区間の検証が必須（幅や空白だけでは見逃す）。本体をテストのためだけに分割しない。回数契約を固定する内部テストは任意。'
