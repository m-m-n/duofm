schema_version: 1
feature: runner-self-test-tmpfile-scope
created: '2026-09-27'
base_branch: main
goal: |
  # runner_self_test.sh の apply_fixture_lists が SELF_TMPDIR の外に一時ファイルを作る

  Notion: https://www.notion.so/3e73509ec8ee81598feaec0a4d7a2868 (種別: バグ)

  ## 現象 (必須)
  `test/e2e/scripts/runner_self_test.sh` の `apply_fixture_lists` が、引数なしの `mktemp` で一時ファイルを作る。一時ファイルは `SELF_TMPDIR` ではなくシステムの一時ディレクトリに作られ、自己テストの書き込み範囲（NFR2）を外れる。
  em-workflow の review round 1 の指摘（stable_id `78ba4f8a81887623`、severity medium、未解決）。

  ## 再現手順 (必須)
  1. PR https://github.com/m-m-n/duofm/pull/12 のブランチで `test/e2e/scripts/runner_self_test.sh` を実行する
  2. 実行中に `apply_fixture_lists` が作る一時ファイルの場所を確認する
  3. `SELF_TMPDIR` の外（`$TMPDIR` や `/tmp`）に作られている

  ## 期待する挙動 (必須)
  `apply_fixture_lists` の一時ファイルは `SELF_TMPDIR` の中に作られる。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)
  `test/e2e/scripts/runner_self_test.sh:100` / `test/e2e/scripts/runner_self_test.sh:107`（`tmp="$(mktemp)"`）

  ## 実害・発生条件 (任意)
  `mv` が成功すれば一時ファイルは残らないが、awk や mv が途中で失敗するとシステムの一時ディレクトリに残る。

  ## 追加指示
  - 実装完了後、integration ブランチを remote へ push し、base_branch への PR を gh pr create で作成する。integration ブランチはローカル・remote とも残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する
  - その議論の内容を Notion に記録する
