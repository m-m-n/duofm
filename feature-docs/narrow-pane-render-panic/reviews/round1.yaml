findings:
- stable_id: 39b88945803ca2e1
  severity: medium
  category: comprehensive
  file: internal/ui/minibuffer.go
  line: 243
  title: Prompt truncation in the new availableWidth<=0 branch counts runes, not display width, so wide-character
    prompts still wrap onto a second line
  description: 'Lines 243-245 (added in this diff) cut the prompt to contentWidth (m.width-4) runes when
    availableWidth<=0. lipgloss wraps by display width and full-width characters take 2 columns, so the
    cut prompt can exceed the content area. Example: reverse-i-search prompt (model_update_keyboard.go:543)
    with pattern ''日本語'' at minibuffer width 26 is cut to 22 runes = 25 columns vs a 22-column area, so
    View() returns 2 lines (reproduced by the evaluator at widths 26 and 30). pane_render.go viewInternal
    reserves one row for the minibuffer, so the pane becomes one row taller. Before this diff these widths
    panicked; SPEC FR6/AC6 scope (widths 0-4, ASCII) is met, so this is a robustness gap, not a spec violation.'
  suggestion: 'In the availableWidth<=0 branch only, truncate promptToRender by display width (ansi.Truncate
    from charmbracelet/x/ansi or runewidth.Truncate, both already transitive lipgloss deps). Leave the
    availableWidth>=1 path unchanged (NFR3). Add a test: prompt "(reverse-i-search)''日本語'': ", widths
    26 and 30, empty and non-empty input, asserting no line break.'
  sources:
  - codex:comprehensive
