schema_version: 1
feature: narrow-pane-render-panic
created: '2026-09-26'
base_branch: main
goal: |
  # ペイン幅 0〜1 で区切り線描画が panic する

  ## 現象
  ペイン幅が 0 または 1 のとき、ペインヘッダの区切り線描画で `strings.Repeat("─", p.width-2)` に負の回数が渡り、`strings: negative Repeat count` で panic する。
  レビュー指摘 stable_id: b0f6a17078ad3f74（medium、header-wrap-hittest の review round1 で未解決）

  ## 再現手順
  1. 端末幅を 3 以下にして duofm を起動する（ペイン幅 = 端末幅 / 2 で 0〜1 になる）
  2. ペインが描画される（通常表示・bg 出力分割表示・dimmed 表示のいずれか）
  3. 区切り線の描画で panic する

  ## 期待する挙動
  ペイン幅 0〜4 でペイン全体（通常表示・bg 出力分割表示・dimmed 表示）を描画しても panic しない。

  ## 完了の定義
  - 再現手順で現象が起きない
  - 再発を検出するテストがある

  ## 該当箇所
  `internal/ui/pane_render.go:62`（viewInternal）/ `internal/ui/pane_render.go:496`（ViewWithBgOutput）/ `internal/ui/pane_render.go:613`（ViewDimmedWithDiskSpace）

  ## 実害・発生条件
  端末幅が 3 以下のとき。`model_view.go` に最小サイズの確認が無い。header-wrap-hittest より前からある不具合。
