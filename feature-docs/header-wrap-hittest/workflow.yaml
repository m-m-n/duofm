schema_version: 1
feature: header-wrap-hittest
created: '2026-09-25'
base_branch: em-workflow/mouse-support/integration
goal: '# ペインヘッダが折り返すとマウスのヒットテストがずれる


  ## 現象 (必須)

  git 管理外のディレクトリで長いパスを開くとペインヘッダが折り返して複数行になり、マウスのクリック・ドラッグ・ダブルクリックが意図と違うエントリに作用する。

  ヒットテストはヘッダを固定 3 行（`mousePaneHeaderRows=3` / `mouseFirstEntryRow=4`）とみなしているが、描画側と定義を共有していない。`pane_render.go` の `renderHeaderLine1` は gitBranch が空のとき displayPath を切り詰めず、lipgloss の `Width(p.width-2)` で折り返す。

  レビュー指摘 stable_id: 52107dd60886982b（medium、mouse-support の review round1 で未解決）

  ## 再現手順 (必須)

  1. git 管理外で、ペイン幅より長いパスのディレクトリを開く

  2. ファイル一覧のエントリをクリックする

  3. クリックした行とは別のエントリが選択される

  ## 期待する挙動 (必須)

  ヘッダの行数に関わらず、クリックした行のエントリが選択される。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  `internal/ui/mouse_hittest.go:9` / `internal/ui/pane_render.go`（renderHeaderLine1）

  ## 実害・発生条件 (任意)

  git 管理外のディレクトリで、パスがペイン幅を超えるとき。

  '
