schema_version: 1
feature: minibuffer-wide-prompt-wrap
created: '2026-09-26'
base_branch: main
goal: |
  # 狭い幅のミニバッファで全角文字を含むプロンプトが 2 行に折り返す

  Notion タスク: https://app.notion.com/p/3e73509ec8ee81789f56f9ce08edbe79 （種別: バグ）

  ## 現象 (必須)
  ミニバッファの入力表示幅が 0 以下になる狭い幅で、プロンプトを「文字数（rune 数）」で切り詰めているため、全角文字を含むプロンプトが表示幅を超えて 2 行に折り返す。ミニバッファは 1 行ぶんしか確保されていないので、ペイン全体の行数も 1 行ずれる。
  レビュー指摘 stable_id: 39b88945803ca2e1（medium、narrow-pane-render-panic の review round1 で未解決）

  ## 再現手順 (必須)
  1. ミニバッファ幅が 26〜32 程度になる端末幅で duofm を起動する
  2. 履歴検索（reverse-i-search）を開き、全角文字（例: 日本語）でパターンを入力する
  3. プロンプト `(reverse-i-search)'日本語': ` が 22 rune に切られても表示幅は 25 桁あり、22 桁の表示領域を超えて 2 行になる

  ## 期待する挙動 (必須)
  全角文字を含むプロンプトでも、ミニバッファは 1 行で描画される。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)
  `internal/ui/minibuffer.go:243`（availableWidth <= 0 の分岐でのプロンプト切り詰め）/ `internal/ui/model_update_keyboard.go:543`（履歴検索プロンプトの組み立て）/ `internal/ui/pane_render.go`（viewInternal のミニバッファ 1 行ぶんの確保）

  ## 実害・発生条件 (任意)
  ミニバッファ幅がおよそ 26〜32 で、プロンプトに全角文字が含まれるとき。availableWidth >= 1 の既存経路にも同じ rune 単位の切り詰めがあるが、こちらは narrow-pane-render-panic より前からある挙動。

  ## 追加指示（起動時）
  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモートともに残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較して良いと判断した選択肢を採用する
  - その議論内容を Notion に記録する
